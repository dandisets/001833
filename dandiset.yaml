description: 'This project will explore a novel strategy to improve cognitive function
  in multi-infarct dementia mice via AAV-mediated overexpression of CYP2C11 targeting
  peri-lesion astrocytes. CYP2C11 is a key generating enzyme of epoxyeicosatrienoic
  acids (EETs). Localized EET production will promote vasodilation, increase cerebral
  blood flow (CBF) in hypoperfused regions, and suppress neuroinflammation, thereby
  potentially improving cognitive function. Thus, AAV-mediated astrocyte overexpression
  of CYP2C11 may provide therapeutic benefit for a large patient population with a
  significant unmet medical need of dementia therapy. '
